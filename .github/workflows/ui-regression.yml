name: UI regression

# Every branch push is checked, so pull requests show the result of their head commit.
on:
  push:
  workflow_dispatch:

jobs:
  playwright:
    # Commits that ask for new Linux baselines are rendered by update-screenshots.yml instead.
    if: ${{ !contains(github.event.head_commit.message, '[update-screenshots]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generated HTML is up to date
        run: |
          python3 scripts/build_site.py --check
          python3 publications/ddsp-carsound/scripts/build_demo.py --html-only
          git diff --exit-code -- publications/ddsp-carsound/index.html
      - name: Local links resolve
        run: python3 tests/check_links.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
